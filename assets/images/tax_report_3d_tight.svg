<svg width="240" height="240" viewBox="48 35 135 155" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">

  <defs>
    <filter id="shadow1" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B4DFF" flood-opacity="0.12"/>
    </filter>

    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F8FF"/>
    </linearGradient>

    <linearGradient id="blueBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3D8BFF"/>
      <stop offset="100%" stop-color="#0B4DFF"/>
    </linearGradient>
  </defs>

  <!-- Documento trasero -->
  <g opacity="0.42">
    <rect
      x="89"
      y="48"
      width="105"
      height="145"
      rx="18"
      fill="#D9E8FF"
      transform="rotate(10 89 48)"
    />
  </g>

  <!-- Documento principal -->
  <g filter="url(#shadow1)">
    <rect
      x="52"
      y="30"
      width="120"
      height="165"
      rx="18"
      fill="url(#paper)"
      transform="rotate(10 52 30)"
    />
  </g>

  <!-- Pie Chart -->
  <g transform="translate(88 52) rotate(10)">
    <circle cx="24" cy="24" r="24" fill="#DCE8FF"/>
    <path d="M24 24V0A24 24 0 0 1 48 24Z" fill="#0B4DFF"/>
    <path d="M24 24L44 38A24 24 0 0 1 5 36Z" fill="#3D8BFF"/>
  </g>

  <!-- Barras -->
  <g transform="translate(75 118) rotate(10)">
    <rect x="0" y="35" width="14" height="20" rx="3" fill="#AEC9FF"/>
    <rect x="22" y="20" width="14" height="35" rx="3" fill="#75A7FF"/>
    <rect x="44" y="0" width="14" height="55" rx="3" fill="url(#blueBar)"/>
    <rect x="66" y="12" width="14" height="43" rx="3" fill="#256DFF"/>
  </g>

  <!-- Líneas superiores -->
  <g opacity="0.7" transform="translate(132 76) rotate(10)">
    <rect width="40" height="4" rx="2" fill="#BFD2FF"/>
    <rect y="12" width="55" height="4" rx="2" fill="#D7E4FF"/>
  </g>

  <!-- Líneas inferiores -->
  <g opacity="0.7" transform="translate(70 176) rotate(10)">
    <rect width="85" height="4" rx="2" fill="#D7E4FF"/>
    <rect y="12" width="60" height="4" rx="2" fill="#D7E4FF"/>
  </g>

</svg>